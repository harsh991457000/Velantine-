<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Suhani ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:32px;
  max-width:420px;
  text-align:center;
  box-shadow:0 25px 45px rgba(0,0,0,0.25);
  animation:fadeIn 1.2s ease;
}

.heart{
  font-size:3rem;
  animation:pulse 1.5s infinite;
  margin-bottom:10px;
}

h1{
  font-size:2.2rem;
  margin-bottom:10px;
}

p{
  font-size:1.05rem;
  line-height:1.7;
  margin:15px 0;
}

button{
  padding:12px 26px;
  border-radius:30px;
  border:none;
  font-size:1rem;
  cursor:pointer;
  margin:8px;
  transition:0.3s;
}

.yes{
  background:#fff;
  color:#ff4d6d;
}

.yes:hover{
  background:#ff4d6d;
  color:#fff;
  transform:scale(1.08);
}

.no{
  background:rgba(255,255,255,0.35);
  color:#fff;
}

.no:hover{
  transform:translateX(40px);
}

.message{
  display:none;
  margin-top:20px;
  font-size:1.25rem;
  animation:fadeIn 1s ease;
}

.final{
  display:block;
  margin-top:10px;
  font-size:1.4rem;
  font-weight:600;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fall{
  to{transform:translateY(110vh);opacity:0}
}

@keyframes floatUp{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<div class="card">
  <div class="heart">❤️</div>
  <h1>Suhani ❤️</h1>

  <p>
    You are my favourite person, my biggest support,
    and the one who cares about me the most.
  </p>

  <p>
    Life feels calmer, happier, and more beautiful
    just because you are in it.
  </p>

  <p><strong>Will you be my Valentine?</strong></p>

  <button class="yes" onclick="showLove()">Yes 💖</button>
  <button class="no">No 🙈</button>

  <div class="message" id="loveMsg">
    💍 You just made me the happiest person ❤️<br>
    <span class="final">Forever with you – Harsh 💖</span>
  </div>
</div>

<script>
function showLove(){
  document.getElementById('loveMsg').style.display='block';
  hearts();
  texts();
}

function hearts(){
  for(let i=0;i<30;i++){
    const h=document.createElement('div');
    h.textContent='❤️';
    h.style.position='fixed';
    h.style.left=Math.random()*100+'vw';
    h.style.top='-20px';
    h.style.fontSize=(20+Math.random()*20)+'px';
    h.style.animation='fall 3s linear forwards';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
}

function texts(){
  for(let i=0;i<6;i++){
    const t=document.createElement('div');
    t.textContent='I love you Suhani ❤️';
    t.style.position='fixed';
    t.style.left=Math.random()*80+'vw';
    t.style.bottom='0';
    t.style.fontSize='1.4rem';
    t.style.fontWeight='600';
    t.style.color='#fff';
    t.style.animation='floatUp 4s ease-out forwards';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),4000);
  }
}
</script>

</body>
</html>
